name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Compute version
        id: version
        run: echo "version=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore signing config
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/electrowave-release.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=electrowave"
            echo "storeFile=electrowave-release.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Rename APK
        run: >
          cp build/app/outputs/flutter-apk/app-release.apk
          "Electrowave-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Electrowave v${{ steps.version.outputs.version }}
          files: Electrowave-v${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
